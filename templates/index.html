<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SGimmicks VPM Repository</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; background: #08111d; color: #eef7ff; }
    main { max-width: 760px; margin: 8vh auto; padding: 32px; }
    section { padding: 28px; border: 1px solid #24516b; border-radius: 18px; background: #0d1c2b; }
    h1 { margin-top: 0; }
    code { display: block; overflow-wrap: anywhere; padding: 14px; border-radius: 10px; background: #050b12; color: #72f0ce; }
    a { color: #72d8ff; }
  </style>
</head>
<body>
  <main>
    <section>
      <h1>SGimmicks VPM Repository</h1>
      <p>現在のパッケージ: v{{VERSION}}</p>
      <p>VCCの「Settings → Packages → Add Repository」に次のURLを登録してください。</p>
      <code>{{REPOSITORY_URL}}</code>
      <p><a href="{{REPOSITORY_URL}}">index.json</a> / <a href="{{PACKAGE_URL}}">パッケージZIP</a></p>
    </section>
  </main>
</body>
</html>
